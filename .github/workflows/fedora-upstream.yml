name: Get Upstream Changes

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Upstream
        run: |
          git remote add upstream https://src.fedoraproject.org/rpms/mesa
          new_branch=fetch-rawhide-$(date +'%Y%m%d%s')
          git checkout -b $new_branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull upstream rawhide --no-ff --no-edit
          rm mesa-*.tar.xz
          git diff --quiet rawhide && echo 'No updates' && exit 1 || echo 'Has updates'
          git add -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'Update mesa'

      - name: Create Pull Request
        run: |
          git config push.autoSetupRemote true
          git push
          gh pr create -B rawhide --title 'Pull fedora mesa upstream changes' --body 'Created by Github action' -a scaryrawr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
